<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniArte - Catálogo de Artículos</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<style>
  /* Forzar vista en mayúsculas en los inputs */
  .text-uppercase-input {
    text-transform: uppercase;
  }

  /* 📌 Contenedor con altura fija y scroll vertical */
  .tabla-scroll {
    max-height: 70vh; /* Ocupa hasta el 70% de la pantalla */
    overflow-y: auto;
  }

  /* 📌 Fijar el encabezado arriba al desplazar hacia abajo */
  .tabla-scroll thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background-color: #212529 !important; /* Mantiene el fondo oscuro de Bootstrap */
    color: #ffffff !important;
  }
</style>
</head>
<body class="bg-light">

  <div class="container-fluid py-4 px-4">
    
    <!-- Encabezado de la Aplicación -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h2 class="fw-bold m-0 text-dark">🎨 UniArte - Gestión de Artículos</h2>
      <div>
        <button class="btn btn-outline-secondary me-2" onclick="abrirModalRubros()">
          📁 Administrar Rubros
        </button>
        <button class="btn btn-primary fw-semibold" 
                data-bs-toggle="modal" 
                data-bs-target="#modalArticulo" 
                onclick="abrirModalCrear()">
          ➕ Nuevo Artículo
        </button>
      </div>
    </div>

    <!-- Barra de Búsqueda -->
    <div class="card shadow-sm mb-4">
      <div class="card-body py-3">
        <div class="row g-2 align-items-center">
          <div class="col">
            <div class="input-group">
              <span class="input-group-text bg-white">🔍</span>
              <input type="text" 
                     id="buscarInput" 
                     class="form-control border-start-0" 
                     placeholder="Buscar por código, descripción o rubro..." 
                     oninput="filtrarTabla()" 
                     onkeyup="filtrarTabla()">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla Principal de Catálogo -->
<div class="card shadow-sm">
  <div class="card-body p-0">
    <!-- 🔹 Se agrega la clase tabla-scroll aquí -->
    <div class="table-responsive tabla-scroll">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th class="text-center" style="width: 70px;">Foto</th>
            <th style="width: 150px;">Código</th>
            <th>Descripción</th>
            <th>Rubro</th>
            <th class="text-end" style="width: 140px;">Precio Venta</th>
            <th class="text-center" style="width: 180px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaArticulos">
          <tr>
            <td colspan="6" class="text-center py-4 text-muted">Cargando catálogo...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

  <!-- MODAL: CREAR / EDITAR ARTÍCULO -->
  <div class="modal fade" id="modalArticulo" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <!-- 🔹 modal-dialog-scrollable evita que los campos se corten en pantalla -->
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="modalTitulo">➕ Nuevo Artículo</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body px-4">
          <div id="alertaModal" class="mb-3"></div>

          <form id="formArticulo">
            
            <!-- Código: Prefijo, Sufijo y Código Automático -->
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label for="codigo_prefijo" class="form-label fw-bold small">Prefijo</label>
                <input type="text" id="codigo_prefijo" class="form-control text-uppercase-input" placeholder="Ej: ART" maxlength="10">
              </div>
              <div class="col-md-4">
                <label for="codigo_sufijo" class="form-label fw-bold small">Sufijo</label>
                <input type="text" id="codigo_sufijo" class="form-control text-uppercase-input" placeholder="Ej: 001" maxlength="10">
              </div>
              <div class="col-md-4">
                <label for="codigo" class="form-label fw-bold small">Código Completo (*)</label>
                <input type="text" id="codigo" class="form-control bg-light fw-bold text-primary" readonly placeholder="Se arma automático">
              </div>
            </div>

            <!-- Descripción -->
            <div class="mb-3">
              <label for="descripcion" class="form-label fw-bold small">Descripción del Artículo (*)</label>
              <input type="text" id="descripcion" class="form-control text-uppercase-input" placeholder="Escribí la descripción del artículo..." required>
            </div>

            <!-- Rubro y Precio -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="rubro" class="form-label fw-bold small">Rubro / Categoría</label>
                <select id="rubro" class="form-select">
                  <option value="0">-- Seleccionar Rubro --</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="precio_venta" class="form-label fw-bold small">Precio de Venta ($)</label>
                <input type="number" id="precio_venta" class="form-control" step="0.01" min="0" value="0.00">
              </div>
            </div>

            <!-- Control de Stock -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="llevar_stock" class="form-label fw-bold small">¿Lleva Stock?</label>
                <select id="llevar_stock" class="form-select">
                  <option value="S">SÍ</option>
                  <option value="N">NO</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="stock_critico" class="form-label fw-bold small">Stock Crítico</label>
                <input type="number" id="stock_critico" class="form-control" min="0" value="0">
              </div>
            </div>

            <!-- Dimensiones y Tiempo de Máquina -->
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label for="ancho" class="form-label fw-bold small">Ancho (cm)</label>
                <input type="number" id="ancho" class="form-control" step="0.01" min="0" value="0.00">
              </div>
              <div class="col-md-4">
                <label for="alto" class="form-label fw-bold small">Alto (cm)</label>
                <input type="number" id="alto" class="form-control" step="0.01" min="0" value="0.00">
              </div>
              <div class="col-md-4">
                <label for="tiempo_maquina" class="form-label fw-bold small">Tiempo Máquina (min)</label>
                <input type="number" id="tiempo_maquina" class="form-control" step="0.1" min="0" value="0.0">
              </div>
            </div>

            <!-- Observaciones -->
            <div class="mb-3">
              <label for="obs" class="form-label fw-bold small">Observaciones</label>
              <textarea id="obs" class="form-control text-uppercase-input" rows="2" placeholder="Notas adicionales..."></textarea>
            </div>

            <!-- 📷 Subida de Foto (Visible siempre al hacer scroll) -->
            <div class="mb-3">
              <label for="inputFoto" class="form-label fw-bold small">📷 Imagen del Artículo (PNG / JPG)</label>
              <input type="file" id="inputFoto" class="form-control" accept="image/*">
            </div>

          </form>
        </div>

        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary px-4 fw-bold" onclick="guardarArticulo()">💾 Guardar Artículo</button>
        </div>

      </div>
    </div>
  </div>

  <!-- ======================================================= -->
  <!-- MODAL: GESTIÓN DE RUBROS                                -->
  <!-- ======================================================= -->
  <div class="modal fade" id="modalRubros" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title">📁 Administrar Rubros / Categorías</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body px-4">
          <div id="alertaRubro" class="mb-2"></div>

          <!-- Formulario de ingreso de Rubros -->
          <form id="formRubro" onsubmit="return false;">
            <input type="hidden" id="rubroEsEdicion" value="false">
            
            <div class="row g-2 mb-3 align-items-end">
              <div class="col-md-3">
                <label for="inputCodigoRubro" class="form-label fw-bold small">Código (*)</label>
                <input type="number" id="inputCodigoRubro" class="form-control fw-bold" placeholder="Ej: 2" min="1" required>
              </div>
              <div class="col-md-6">
                <label for="inputNombreRubro" class="form-label fw-bold small">Descripción (*)</label>
                <input type="text" id="inputNombreRubro" class="form-control text-uppercase-input" placeholder="Nombre del Rubro..." required>
              </div>
              <div class="col-md-3 d-flex gap-1">
                <button class="btn btn-secondary btn-sm w-50 d-none" type="button" id="btnCancelarRubro" onclick="limpiarFormRubro()">❌ Cancelar</button>
                <button class="btn btn-primary btn-sm fw-bold w-100" type="button" id="btnGuardarRubro" onclick="guardarRubro()">➕ Agregar</button>
              </div>
            </div>
          </form>

          <hr class="my-3">

          <!-- Tabla de Rubros con Scroll Interno y Distribución de Ancho -->
<div class="table-responsive border rounded" style="max-height: 280px; overflow-y: auto; overflow-x: auto;">
  <table class="table table-sm table-hover align-middle mb-0 w-100">
    <thead class="table-light sticky-top" style="z-index: 10;">
      <tr>
        <th style="width: 20%;">Código</th>
        <th style="width: 50%;">Descripción</th>
        <th class="text-center" style="width: 30%;">Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaRubros">
      <tr>
        <td colspan="3" class="text-center text-muted py-3">Cargando rubros...</td>
      </tr>
    </tbody>
  </table>
</div>

        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>

      </div>
    </div>
  </div>

  <!-- ======================================================= -->
  <!-- SCRIPTS (Bootstrap JS primero, luego la lógica propia)   -->
  <!-- ======================================================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/rubros.js"></script>
<script src="/js/articulos.js"></script>

</body>
</html>
